<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>X Finder</title>
<!-- ホーム画面に追加して、アプリのように全画面で使う(PWA)。Access の確認が要るので manifest も cookie 付きで読む -->
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="X Finder">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3f5f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1118" media="(prefers-color-scheme: dark)">
<script>
// 画面の色(白/黒/システムに合わせる)はこの端末に保存。描く前に決めて、一瞬ちがう色が出ないようにする
function applyTheme(t){
  const r=document.documentElement;
  if(t==="light"||t==="dark")r.dataset.theme=t;else delete r.dataset.theme;
  document.querySelectorAll('meta[name="theme-color"]').forEach(m=>{
    if(t==="light"||t==="dark"){m.content=t==="dark"?"#0e1118":"#f3f5f8";m.removeAttribute("media")}
    else{const d=m.dataset.dark==="1";m.content=d?"#0e1118":"#f3f5f8";m.media=`(prefers-color-scheme: ${d?"dark":"light"})`}
  });
}
document.querySelectorAll('meta[name="theme-color"]').forEach((m,i)=>{m.dataset.dark=i?"1":"0"});
try{applyTheme(localStorage.getItem("finder-theme")||"system")}catch(e){}
// 文字のフォントもこの端末に保存。ゴシック(最初から読み込む)と端末の文字以外は、選んだときだけ読み込む
const FONT_CSS={
  round:"M+PLUS+Rounded+1c:wght@400;500;700",
  mincho:"Shippori+Mincho:wght@400;500;700",
  hand:"Klee+One:wght@400;600",
};
function loadFont(f){
  if(!FONT_CSS[f]||document.getElementById("font-"+f))return;
  const l=document.createElement("link");l.id="font-"+f;l.rel="stylesheet";l.href=`https://fonts.googleapis.com/css2?family=${FONT_CSS[f]}&display=swap`;document.head.appendChild(l);
}
function applyFont(f){
  const r=document.documentElement;
  if(f in FONT_CSS||f==="system")r.dataset.font=f;else delete r.dataset.font;
  loadFont(f);
}
try{applyFont(localStorage.getItem("finder-font")||"gothic")}catch(e){}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* N13 X Finder: スマホ1列。上に絞り込みと並び順、点数つきのカード、タップで下から詳細。 */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#eaeef4; --line:#d9dfe8;
  --fg:#141a24; --muted:#5d6878; --accent:#2b54d6; --accent-soft:#e3e9fb;
  --rec:#e2372b; --rec-soft:#fde6e3; --ok:#1d8a55; --ok-soft:#e0f3e9; --warn:#b26a00; --warn-soft:#fbefd9; --chk:#6a4bd6; --chk-soft:#ece7fb;
  --font-body:"Zen Kaku Gothic New",system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
  --font-num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
}
:root[data-font="round"]{--font-body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",system-ui,sans-serif}
:root[data-font="mincho"]{--font-body:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif}
:root[data-font="hand"]{--font-body:"Klee One","Hiragino Maru Gothic ProN",system-ui,sans-serif}
:root[data-font="system"]{--font-body:system-ui,-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif}
:root{
  --r:14px; --shadow:0 1px 2px rgba(20,26,36,.06),0 4px 14px rgba(20,26,36,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1118; --surface:#161b25; --surface-2:#1f2633; --line:#2a3242;
  --fg:#e8ecf3; --muted:#97a2b4; --accent:#7f9cff; --accent-soft:#1f2a4a;
  --rec:#ff5a4d; --rec-soft:#3a1b19; --ok:#4fd08f; --ok-soft:#14301f; --warn:#f0b04a; --warn-soft:#352812; --chk:#a58cff; --chk-soft:#241c3f;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1118; --surface:#161b25; --surface-2:#1f2633; --line:#2a3242;
  --fg:#e8ecf3; --muted:#97a2b4; --accent:#7f9cff; --accent-soft:#1f2a4a;
  --rec:#ff5a4d; --rec-soft:#3a1b19; --ok:#4fd08f; --ok-soft:#14301f; --warn:#f0b04a; --warn-soft:#352812; --chk:#a58cff; --chk-soft:#241c3f;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.55;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior-y:none}
/* スマホで: カードの長押しで文字選択やプレビューが出ない。ボタンの連打で拡大しない */
.card,.chip,.tab,.btn,.icon-btn{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 40px}
/* 一番上で下に引っぱると再読み込み */
.ptr{height:0;overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:13px}
.ptr.back{transition:height .2s}
.ptr .spin{display:inline-block;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);margin-inline:-16px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 10px;border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.02em}
.sub{color:var(--muted);font-size:12px}
.cost{font-family:var(--font-num);font-size:15px;font-variant-numeric:tabular-nums;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
.cost b{font-weight:600}
button.cost{color:var(--fg);cursor:pointer;font-family:var(--font-num)}
button.cost::after{content:" ›";color:var(--muted)}
/* サマリー */
.seg{display:inline-grid;grid-auto-flow:column;gap:2px;background:var(--surface-2);border-radius:10px;padding:3px;margin-top:8px}
.seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;border-radius:8px;padding:5px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.kpi{background:var(--surface-2);border-radius:12px;padding:10px 12px;min-width:0}
.kpi .k{font-size:11.5px;color:var(--muted)}
.kpi .v{font-family:var(--font-num);font-size:26px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:13px;font-weight:500;color:var(--muted);margin-left:2px}
.kpi .s{font-size:11.5px;color:var(--muted)}
.chart{width:100%;height:auto;display:block;margin-top:4px}
.chart text{font-family:var(--font-num);font-size:10px;fill:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.cmp{width:100%;border-collapse:collapse;font-size:13px}
.cmp th{font-weight:500;color:var(--muted);font-size:11.5px;text-align:right;padding:4px 0 4px 8px}
.cmp th:first-child,.cmp td:first-child{text-align:left;padding-left:0}
.cmp td{text-align:right;padding:6px 0 6px 8px;border-top:1px solid var(--line);font-family:var(--font-num);font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.cmp td:first-child{font-family:var(--font-body);font-size:13px}
.up{color:var(--ok)} .down{color:var(--rec)}
.hbars{display:grid;gap:6px;font-size:13px}
.hbar{display:grid;grid-template-columns:9.5em 1fr 2.5em;gap:8px;align-items:center}
.hbar .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .b{height:10px;border-radius:5px;background:var(--accent)}
.hbar .n{text-align:right;font-family:var(--font-num);font-size:15px}
.scroller{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-top:10px;padding-bottom:2px}
.scroller::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip.warn[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:#fff}
.chip:focus-visible,.card:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row2{display:flex;gap:8px;margin-top:8px;align-items:center}
select{font:inherit;font-size:16px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:6px 8px}
#sort{flex:none;width:6.6em;padding:5px 4px;font-size:16px}
.icon-btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:5px 9px;font:inherit;font-size:13px;cursor:pointer}
.note{margin:12px 0 4px;font-size:12px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:8px 10px}
.note.warn{color:var(--warn);background:var(--warn-soft)}
.list{display:grid;gap:12px;margin-top:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:4px 12px;text-align:left;color:inherit;font:inherit;width:100%}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.pill{font-size:11.5px;border-radius:6px;padding:2px 7px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.type{background:var(--accent-soft);color:var(--accent);font-weight:500}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.gone{background:var(--surface-2);color:var(--muted);border:1px dashed var(--muted)}
.ctag{display:inline-block;font-size:11px;line-height:1.5;border-radius:5px;padding:0 5px;margin-left:4px;background:var(--surface-2);color:var(--muted);vertical-align:1px;white-space:nowrap}
.ctag.minor{background:var(--rec-soft);color:var(--rec);font-weight:600}
/* Google カレンダーの照合 */
.cal{font-size:11px;border-radius:5px;padding:1px 6px;margin-left:6px;white-space:nowrap;font-weight:500}
.cal.busy{background:var(--warn-soft);color:var(--warn)}
.cal.free{background:var(--ok-soft);color:var(--ok)}
.calday{display:block}
.calday+.calday{margin-top:4px}
.calday .ev{color:var(--warn)}
.calday .none{color:var(--ok)}
/* カレンダーから日付を選ぶ */
.daybar[hidden]{display:none}
.daybar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:12px 0 0;padding:8px 10px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-size:13px}
.calhead{display:flex;align-items:center;justify-content:space-between;margin:4px 0}
.calhead h2{margin:0;font-size:17px}
.calhead .icon-btn{font-size:18px;padding:2px 14px}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin-top:8px}
.cw{text-align:center;font-size:11px;color:var(--muted);padding:2px 0}
.cw.sun,.cd.sun .dn{color:var(--rec)} .cw.sat,.cd.sat .dn{color:var(--accent)}
.cd{position:relative;min-height:64px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);font:inherit;padding:3px 2px 2px;display:flex;flex-direction:column;align-items:stretch;gap:1px;text-align:left;cursor:pointer;overflow:hidden;min-width:0}
.cd.empty{border:0;background:none;cursor:default}
.cd.past{opacity:.45}
.cd.today{border-color:var(--fg)}
.cd.sel{outline:2px solid var(--accent);outline-offset:-1px}
.cd .dn{font-size:12px;font-family:var(--font-num);padding-left:2px}
.cd .cn{position:absolute;top:2px;right:2px;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;font-weight:600;line-height:18px;text-align:center;padding:0 4px}
.cd .ce{font-size:9.5px;line-height:1.3;border-radius:3px;padding:0 2px;background:var(--warn-soft);color:var(--warn);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd .ce.off{background:var(--ok-soft);color:var(--ok)}
.cd .cm{font-size:9.5px;color:var(--muted);padding-left:2px}
/* 仕分け(チェックした値に当てはまる新着を削除予定にする) */
.sortbtn[hidden]{display:none}
.sortbtn{flex:1;min-width:0;display:flex;justify-content:space-between;align-items:center;gap:6px;font-weight:700;font-size:14px}
.sortbtn .lbl{display:flex;flex-direction:column;align-items:flex-start;min-width:0;line-height:1.25;white-space:nowrap}
.sortbtn .ps{max-width:100%;font-weight:600;font-size:11px;color:var(--accent);overflow:hidden;text-overflow:ellipsis}
.sortbtn .ps.none{color:var(--muted)}
.sortbtn .mode{flex:none;border-radius:999px;font-size:11px;font-weight:700;line-height:1.5;padding:0 8px;border:1px solid var(--line);color:var(--muted)}
.sortbtn .mode.auto{background:var(--rec);border-color:var(--rec);color:#fff}
/* プリセットは指で押しやすい大きさにする(名前と×を線で分け、×の押し間違いを減らす) */
.sort-presets{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.preset{display:inline-flex;align-items:stretch;border-radius:999px;background:var(--accent-soft)}
.preset .chip{border-color:transparent;background:transparent;color:var(--accent);font-weight:600;font-size:15px;min-height:44px;min-width:72px;padding:0 14px 0 18px}
.preset .pdel{border:0;border-left:1px solid color-mix(in srgb,var(--accent) 25%,transparent);background:transparent;color:var(--accent);font:inherit;font-size:16px;width:40px;padding:0 4px 0 0;cursor:pointer;opacity:.75}
.preset.on{background:var(--accent)} .preset.on .chip,.preset.on .pdel{color:#fff} .preset.on .pdel{border-left-color:rgba(255,255,255,.35)}
.chip.add{border-style:dashed;color:var(--muted);min-height:44px;font-size:14px;padding:0 16px}
.sort-grp{margin-top:16px;font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.05em;border-bottom:1px solid var(--line);padding-bottom:2px}
.sort-item{margin-top:10px}
.sort-item h3{font-size:13px;margin:0 0 6px}
.sort-ihead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.linkbtn{border:0;background:none;color:var(--accent);font:inherit;font-size:12.5px;font-weight:600;padding:2px 0;cursor:pointer}
.asub{font-size:11.5px;font-weight:700;color:var(--muted);margin:8px 0 4px}
.arow{display:flex;gap:6px;align-items:flex-start}
.arow+.arow{margin-top:5px}
.alabel{flex:none;width:4.6em;font-size:11px;color:var(--muted);padding-top:4px;line-height:1.3}
.alabel:empty{display:none}
.arow .vals{flex:1;min-width:0;gap:4px}
.v.sm{font-size:12px;padding:3px 7px;gap:4px;border-radius:7px}
.v.sm i{width:12px;height:12px;border-radius:3px}
.v.sm[aria-pressed="true"] i::after{font-size:9px;line-height:10px}
.v.zero{color:var(--muted)}
.vals{display:flex;flex-wrap:wrap;gap:6px}
.v{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);font:inherit;font-size:13px;padding:5px 9px;cursor:pointer}
.v i{flex:none;width:15px;height:15px;border:1.5px solid var(--line);border-radius:4px;position:relative}
.v small{color:var(--muted);font-family:var(--font-num);font-size:14px}
.v.na{border-style:dashed}
.v[aria-pressed="true"]{background:var(--rec-soft);border-color:var(--rec);border-style:solid;color:var(--rec)}
.v[aria-pressed="true"] small{color:var(--rec)}
.v[aria-pressed="true"] i{background:var(--rec);border-color:var(--rec)}
.v[aria-pressed="true"] i::after{content:"✓";position:absolute;inset:0;color:#fff;font-size:11px;line-height:12px;text-align:center}
.sort-auto{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;padding:10px 12px;background:var(--surface-2);border-radius:12px;font-size:14px;cursor:pointer}
.switch{flex:none;width:44px;height:26px;border-radius:999px;border:0;background:var(--line);position:relative;cursor:pointer;transition:background .15s}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.switch[aria-checked="true"]{background:var(--ok)} .switch[aria-checked="true"]::after{left:21px}
.sort-foot{position:sticky;bottom:calc(-24px - env(safe-area-inset-bottom,0px));z-index:2;background:var(--surface);margin:12px -16px calc(-24px - env(safe-area-inset-bottom,0px));padding:10px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.sort-foot .sum{font-size:13px;margin:0 0 8px}
.sort-foot .sum b{color:var(--rec)}
.sort-foot .actions{margin-top:0}
.sort-foot .actions .btn{padding:12px 6px;white-space:nowrap}
.sort-foot .actions [data-close]{flex:0 0 5.5em}
.btn.del.fill{background:var(--rec);border-color:var(--rec);color:#fff}
.wpt{font-family:var(--font-num);font-size:12px;font-weight:600;margin-left:4px}
.wpt.minus{color:var(--rec)} .wpt.plus{color:var(--ok)}
.score-max{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.score-max input{width:84px;font:inherit;font-family:var(--font-num);font-size:16px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
.score-max input:focus{outline:2px solid var(--accent);outline-offset:1px}
.score{grid-row:1 / span 2;grid-column:2;text-align:right;line-height:1}
.score .n{font-family:var(--font-num);font-weight:700;font-size:36px;font-variant-numeric:tabular-nums}
.score .l{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.08em;margin-top:2px}
.title{font-weight:700;font-size:16px;margin-top:4px;min-width:0;text-wrap:balance;overflow-wrap:anywhere}
.excerpt{grid-column:1 / -1;margin:6px 0 0;font-size:12.5px;line-height:1.5;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-width:0;overflow-wrap:anywhere}
.facts{grid-column:1 / -1;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13px;margin:8px 0 0}
.facts dt{color:var(--muted)} .facts dd{margin:0;min-width:0;overflow-wrap:anywhere}
.client{grid-column:1 / -1;display:flex;align-items:center;gap:10px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px;min-width:0}
.ava{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;object-fit:cover;background:var(--muted)}
.client .who{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.num{font-family:var(--font-num);font-size:15px;font-variant-numeric:tabular-nums}
.ff{margin-left:auto;text-align:right;white-space:nowrap}
.ff small{display:block;color:var(--muted);font-size:10.5px;font-family:var(--font-body)}
/* 下へスクロールしている間は上部をたたむ: 状態タブは数字と色だけ、絞り込みの行は隠す。上へ戻すと広げる */
.tab .t{display:block;max-height:1.4em;overflow:hidden;transition:max-height .22s ease,opacity .18s ease}
.filters{display:grid;grid-template-rows:1fr;transition:grid-template-rows .22s ease,opacity .18s ease}
.filters>div{min-height:0;overflow:hidden}
header.top.slim .tab .t{max-height:0;opacity:0}
header.top.slim .filters{grid-template-rows:0fr;opacity:0;pointer-events:none}
header.top.slim .tab .c{font-size:17px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:10px;background:var(--surface-2);border-radius:12px;padding:3px}
.tab{border:0;background:transparent;color:var(--muted);font:inherit;font-size:12.5px;border-radius:9px;padding:6px 2px;cursor:pointer;white-space:nowrap}
.tab .c{display:block;font-family:var(--font-num);font-size:16px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
/* 状態ごとの色: 新着=青 確認中=紫 受注中=緑 保留=オレンジ 削除予定=赤 */
.tab[data-tab="new"]{--tc:var(--accent);--tc-soft:var(--accent-soft)} .tab[data-tab="checking"]{--tc:var(--chk);--tc-soft:var(--chk-soft)} .tab[data-tab="accepted"]{--tc:var(--ok);--tc-soft:var(--ok-soft)}
.tab[data-tab="hold"]{--tc:var(--warn);--tc-soft:var(--warn-soft)} .tab[data-tab="delete"]{--tc:var(--rec);--tc-soft:var(--rec-soft)}
.tab .c{color:var(--tc)}
.tab[aria-pressed="true"]{background:var(--tc-soft);color:var(--tc);box-shadow:inset 0 0 0 1.5px var(--tc)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.pill.hold{background:var(--warn-soft);color:var(--warn);font-weight:500}
.pill.del{background:var(--rec-soft);color:var(--rec)}
.pill.acc{background:var(--ok-soft);color:var(--ok);font-weight:500}
.pill.chk{background:var(--chk-soft);color:var(--chk);font-weight:500}
.detail-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:20px}
.detail-actions .btn{padding:13px 4px;font-size:14px;white-space:nowrap}
/* 保留・削除予定はタブと同じ色、ブラックリストは黒と赤 */
.btn.acc{grid-column:1/-1;border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.btn.acc.on{background:var(--ok);color:#fff}
.btn.chk{grid-column:1/-1;border-color:var(--chk);color:var(--chk);background:var(--chk-soft)}
.btn.chk.on{background:var(--chk);color:#fff}
.btn.hold{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.btn.hold.on{background:var(--warn);color:#fff}
.btn.del{border-color:var(--rec);color:var(--rec);background:var(--rec-soft)}
.btn.del.on{background:var(--rec);color:#fff}
.btn.blk{border-color:var(--rec);color:var(--rec);background:var(--rec-soft)}
.btn.blk:disabled{opacity:.6}
.post.link{display:block;color:inherit;text-decoration:none;cursor:pointer;position:relative}
.post .open-x{display:block;text-align:right;color:var(--accent);font-size:12.5px;font-weight:700;margin-top:6px;white-space:normal}
.btn.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.btn.danger.on{background:var(--rec);border-color:var(--rec);color:#fff}
.btn:disabled{opacity:.6;cursor:default}
.swipe{position:relative;border-radius:var(--r);overflow:hidden}
/* 裏の色はスワイプしている間だけ出す(スクロール中に裏が透けてチカチカしないように) */
.swipe-bg{visibility:hidden;position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-weight:700;font-size:14px;color:#fff;background:var(--muted);border-radius:var(--r)}
.swipe-bg.hold{background:var(--warn)} .swipe-bg.delete{background:var(--rec)} .swipe-bg.accepted{background:var(--ok)} .swipe-bg.checking{background:var(--chk)} .swipe-bg.new{background:var(--accent)}
.swipe-bg.toR,.swipe-bg.toL{visibility:visible}
.swipe-bg{opacity:.55;transition:opacity .12s} .swipe-bg.ready{opacity:1}
.swipe-bg .l,.swipe-bg .r{opacity:0} .swipe-bg.toR .l,.swipe-bg.toL .r{opacity:1}
.swipe .card{position:relative;touch-action:pan-y}
.swipe .card.dragging{will-change:transform}
.swipe .card.snap{transition:transform .2s ease-out}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);border-radius:12px;padding:10px 12px 10px 14px;display:flex;width:max-content;gap:14px;align-items:center;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.toast[hidden]{display:none}
.toast span{min-width:0}
.toast button{white-space:nowrap;flex:none;border:0;background:transparent;color:var(--accent);font:inherit;font-weight:700;cursor:pointer;padding:4px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .toast button{color:#2b54d6}}
:root[data-theme="dark"] .toast button{color:#2b54d6}
/* 左上の「X Finder」= 設定を開くボタン */
.brand{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px;font-family:var(--font-num);font-size:24px;font-weight:700;letter-spacing:.06em;line-height:1.1;color:var(--fg);-webkit-tap-highlight-color:transparent}
.brand .chev{font-size:15px;color:var(--muted);transform:translateY(1px)}
.brand:active{opacity:.6}
.help-btn{width:100%;margin-top:8px}
.help details{border-top:1px solid var(--line)}
.help details:last-child{border-bottom:1px solid var(--line)}
.help summary{padding:13px 2px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
.help summary::-webkit-details-marker{display:none}
.help summary::after{content:"›";color:var(--muted);transition:transform .15s}
.help details[open] summary::after{transform:rotate(90deg)}
.help .hb{padding:0 2px 12px;font-size:14px}
.help .hb p{margin:0 0 8px} .help .hb ul{margin:0 0 8px;padding-left:1.2em} .help .hb li{margin:4px 0}
.font-sample{margin:4px 0 0;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:16px}
.theme-seg{display:grid;grid-template-columns:1fr 1fr 2fr;gap:4px;background:var(--surface-2);border-radius:12px;padding:4px}
.theme-seg button{white-space:nowrap;border:0;background:transparent;color:var(--muted);font:inherit;font-size:14px;padding:9px 4px;border-radius:9px;cursor:pointer}
.theme-seg button.on{background:var(--surface);color:var(--fg);font-weight:700;box-shadow:var(--shadow)}
/* ブラックリスト */
.black{margin-top:16px}
.black:empty{display:none}
.black form{border:1px solid var(--rec);background:var(--rec-soft);border-radius:12px;padding:12px;display:grid;gap:10px}
.black .why{display:flex;flex-wrap:wrap;gap:6px}
.black .why label{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.black .why input{position:absolute;opacity:0;pointer-events:none}
.black .why label:has(input:checked){background:var(--rec);border-color:var(--rec);color:#fff}
.black input[type=text]{font:inherit;font-size:16px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:8px 10px;width:100%;box-sizing:border-box}
.black .row{display:flex;gap:8px}
.black .bnote{font-size:13px;color:var(--muted);margin:4px 0 0}
.btn.danger.fill{background:var(--rec);border-color:var(--rec);color:#fff}
.blist{display:grid;gap:8px}
.blist .person .why{font-size:12px;color:var(--rec);font-weight:700}
.blist .unblock{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
/* データベースの中身 */
.dbt{display:grid;gap:6px}
.dbt button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:12px;cursor:pointer}
.dbt .en{color:var(--muted);font-size:12px;margin-left:6px}
.dbt .n{font-family:var(--font-num);font-size:17px;font-variant-numeric:tabular-nums}
.dbrow{border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-top:8px;display:grid;grid-template-columns:minmax(6.5em,auto) 1fr;gap:2px 10px;font-size:12.5px}
.dbrow dt{color:var(--muted);overflow-wrap:anywhere}
.dbrow dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.dbrow dd.null{color:var(--muted)}
.dbbar{display:flex;gap:8px;align-items:center;margin:8px 0}
.dbbar input{flex:1;min-width:0;font:inherit;font-size:16px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:8px 10px}
.setting{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.setting select{font-size:16px;padding:8px}
/* スワイプの設定: 状態タブごとに左・右を選ぶ表。タブ名は状態の色 */
.swgrid{display:grid;grid-template-columns:auto 1fr 1fr;gap:8px 8px;align-items:center;margin-top:4px}
.swgrid>.sub{font-size:12px;text-align:center}
.swgrid select{min-width:0;width:100%;font-size:15px;padding:7px 4px}
.swtab{font-weight:700;font-size:14px;white-space:nowrap}
.swtab[data-tab-c="new"]{color:var(--accent)} .swtab[data-tab-c="checking"]{color:var(--chk)} .swtab[data-tab-c="accepted"]{color:var(--ok)} .swtab[data-tab-c="hold"]{color:var(--warn)} .swtab[data-tab-c="delete"]{color:var(--rec)}
.empty{text-align:center;color:var(--muted);padding:40px 0}
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.45);z-index:20;touch-action:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:20px 20px 0 0;max-height:88%;overflow-y:auto;overscroll-behavior:none;-webkit-overflow-scrolling:touch;padding:8px 16px calc(24px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;box-shadow:0 -8px 30px rgba(0,0,0,.18)}
/* 詳細などのシートは、出したあとに .in を付けて下からせり上がる(transition。途中で描き直しても動きが巻き戻らない) */
.scrim{opacity:0;transition:opacity .3s ease-out}
.scrim.in{opacity:1}
.sheet{transform:translate3d(0,100%,0);transition:transform .34s cubic-bezier(.2,.85,.25,1)}
.sheet.in{transform:none}
.sheet.drag{transition:none}
.sheet.now,.scrim.now{transition:none}
@media (prefers-reduced-motion:reduce){.sheet,.scrim{transition:none}}
.card.opening{opacity:.7;transition:opacity .1s}
.card.wait{position:relative}
.card.wait::after{content:"";position:absolute;right:14px;bottom:14px;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
/* 一度でも引っぱったシートは、開くときのアニメーションをもう出さない(戻したときに一瞬薄くなるのを防ぐ) */

.sheet.drag{will-change:transform}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.sheet h2{font-size:18px;margin:6px 0 2px;text-wrap:balance;overflow-wrap:anywhere}
.sec{margin-top:18px}
.sec h3{font-size:12px;letter-spacing:.08em;color:var(--muted);margin:0 0 8px;font-weight:500}
.post{background:var(--surface-2);border-radius:12px;padding:12px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.post + .post{margin-top:8px}
.post .from{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px}
.media{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;margin-top:8px}
.media button{border:0;padding:0;background:var(--surface-2);cursor:zoom-in;border-radius:10px;display:block;aspect-ratio:1;overflow:hidden;position:relative}
/* 画像の場所は枠(button)で先に取る。画像は届いたら枠いっぱいに出す(高さが変わらない) */
.media img{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover;opacity:0;transition:opacity .2s}
.media img.ok{opacity:1}
/* 案件の詳細は高さを決めておく(あとから中身が足されても、上の端が動かない) */
.sheet.case{height:88%}
/* 画像を X Finder の中で大きく見る。左右スワイプで次の画像、× か画像の外をタップで閉じる */
.viewer{position:fixed;inset:0;z-index:40;background:#000;display:flex;flex-direction:column}
.viewer[hidden]{display:none}
.viewer .vhint{font-family:var(--font-body);font-size:12px;color:rgba(255,255,255,.6)}
.viewer .vbar{display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;color:#fff;font-family:var(--font-num);font-size:16px}
.viewer .vclose{border:0;background:rgba(255,255,255,.16);color:#fff;width:40px;height:40px;border-radius:50%;font-size:22px;line-height:40px;cursor:pointer}
.viewer .strip{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior:contain}
.viewer .strip::-webkit-scrollbar{display:none}
.viewer .slide{flex:0 0 100%;scroll-snap-align:center;display:grid;place-items:center;padding:0 0 calc(24px + env(safe-area-inset-bottom,0px))}
.viewer .slide img{max-width:100%;max-height:100%;object-fit:contain;-webkit-user-select:none;user-select:none}
.person.link{width:100%;text-align:left;font:inherit;color:inherit;background:var(--surface);cursor:pointer;text-decoration:none}
.person .go{flex:none;color:var(--accent);font-size:12.5px;font-weight:700;white-space:nowrap}
.people{display:grid;gap:8px}
.person{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.person .who{min-width:0;flex:1}
.person .id{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.breakdown{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13px;margin:0}
.breakdown dd{margin:0;text-align:right;font-family:var(--font-num);font-size:15px;font-variant-numeric:tabular-nums}
.breakdown .total{border-top:1px solid var(--line);padding-top:4px;font-weight:700}
.actions{display:flex;gap:8px;margin-top:20px}
.btn{flex:1;text-align:center;font:inherit;font-weight:700;border-radius:12px;padding:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="bar">
      <div><h1 style="margin:0;font-size:inherit"><button type="button" class="brand" id="openSettings" aria-label="設定を開く">X Finder<span class="chev" aria-hidden="true">▾</span></button></h1><div class="sub" id="count">読み込み中…</div></div>
      <button class="cost" id="cost" title="今月の API 費用 / 目標。タップでサマリー" aria-label="サマリーを見る">今月 —</button>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="確認の状態"></div>
    <div class="filters" id="filters"><div>
    <div class="row2">
      <button class="icon-btn sortbtn" id="openSort" aria-label="仕分け">仕分け</button>
      <select id="sort" aria-label="並び順">
        <option value="score">点数順</option>
        <option value="new">新着順</option>
        <option value="ff">FF率順</option>
        <option value="followers">フォロワー数順</option>
      </select>
      <button class="icon-btn" id="openCal" aria-label="カレンダーから日付を選ぶ" title="カレンダーから日付を選ぶ">日付</button>
    </div>
    </div></div>
  </header>
  <div class="ptr" id="ptr" aria-live="polite"><span id="ptrText"></span></div>
  <p class="note" id="status" hidden></p>
  <div class="daybar" id="rejBar" hidden></div>
  <div class="daybar" id="dayBar" hidden></div>
  <div class="list" id="list"></div>
</div>
<div id="sheetRoot" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="画像" hidden>
  <div class="vbar"><span id="vcount"></span><span class="vhint">上下にスワイプで閉じる</span><button class="vclose" id="vclose" aria-label="閉じる">×</button></div>
  <div class="strip" id="strip"></div>
</div>

<script>
// ホームでは絞り込まない。「仕分け」でチェックした値に1つでも当てはまる新着を、削除予定に移す(受注中・保留は触らない)。
// 値は案件から作る。書いていない・分からないものも「記載なし」「不明」という1つの値として選べる
const SORT_FACETS=[
  {k:"gender",g:"依頼主",t:"性別",v:c=>c.gender||"記載なし"},
  // 年齢は「未成年」と5歳刻み。「20代」「30↑」のように幅がある人は、当てはまる刻みを全部持つ(全部にチェックが付いたときだけ当てはまる)
  {k:"age",g:"依頼主",t:"年齢",v:c=>ageValues(c),all:true},
  // 活動地域は複数書いてあることがある。全部にチェックが付いたときだけ当てはまる(東京と大阪の人は、大阪のチェックだけでは移さない)
  {k:"area",g:"依頼主",t:"活動地域",v:c=>(c.areas||[]).length?c.areas:["記載なし"],all:true},
  {k:"shoot",g:"案件",t:"撮影場所",v:c=>c.shoot_pref||"不明"},
  {k:"plan",g:"案件",t:"撮影日の予定",v:c=>{const k=calCheck(c);return !k?"日付不明":k.busy?"予定あり":k.off?"休み":"空き"},show:()=>cal.configured&&!cal.error},
  // 点数は「この点数以下」の数字を1つだけ入れる(rule.score は ["-50"] の形)。値のチェックではなく数字の欄で選ぶ
  {k:"score",g:"案件",t:"点数",num:true,v:()=>[]},
  {k:"type",g:"案件",t:"種類",v:c=>c.case_type||"その他"},
];
const NA_VALUES=["記載なし","不明","日付不明"];
// 点数表の作品に当たったときの点(カードの「作品」の行の後ろに小さく出す。マイナスは赤、プラスは緑)
// 作品名が「作品」の行にすでに書いてあれば点だけ、書いてなければ点数表の名前と点を出す
const workTags=c=>(c.work_points||[]).map(w=>`<span class="wpt ${w.points<0?"minus":"plus"}" title="点数表の作品「${esc(w.name)}」">${(c.works||"").includes(w.name)?"":esc(w.name)+" "}${w.points>0?"+":""}${Math.round(w.points)}</span>`).join("");
const AGE_RANGES=[[18,19],[20,24],[25,29],[30,34],[35,39],[40,44],[45,49],[50,99]];
const AGE_BUCKETS=AGE_RANGES.map(([a,b])=>b>=99?`${a}以上`:`${a}〜${b}`);
const AGE_ADULT="成人(年齢不明)";
// プロフィールから読んだ年齢({label, minor})を、仕分けの値にする。label は「25歳」「20代」「30↑」「18↓」「成人」「未成年」
function ageValues(c){
  const a=c.age;if(!a)return ["記載なし"];
  if(a.minor===true)return ["未成年"];
  const m=/^(\d+)(歳|代|↑|↓)$/.exec(a.label||"");
  if(!m)return [a.minor===false?AGE_ADULT:"記載なし"];
  const n=+m[1],[lo,hi]={"歳":[n,n],"代":[n,n+9],"↑":[n,99],"↓":[0,n]}[m[2]];
  const out=lo<18?["未成年"]:[];
  AGE_RANGES.forEach(([x,y],i)=>{if(lo<=y&&hi>=x)out.push(AGE_BUCKETS[i])});
  return out;
}
const TYPES=["コスプレ撮影","コスパフォ","踊ってみた","ポートレート","イベント","その他"];
// 値の並び。ここにない値は件数の多い順、記載なし・不明は最後
const SORT_ORDER={gender:["女性","男性"],plan:["空き","休み","予定あり"],type:TYPES};
const ROLE={mention:"メンション",quoted:"引用元の投稿者",reply_to:"リプライ先",image:"画像から"};
// カードの状態。新着=集めた案件が最初に入る(開いても変わらない) / 確認中=一度見て、まだ決めていない案件(自分で移したときだけ)
// 受注中=引き受けた案件(2週間を過ぎても残る) / 保留=ピン留め(2週間を過ぎても残る) / 削除予定=投稿日から14日で消える
const TABS=[{k:"new",t:"新着"},{k:"checking",t:"確認中"},{k:"accepted",t:"受注中"},{k:"hold",t:"保留"},{k:"delete",t:"削除予定"}];
const DELETE_DAYS=14;
// 左右のスワイプで付ける状態(左上の「X Finder」から開く設定で変えられる。保存先は D1 なので、どの端末でも同じ)
const SWIPE_LABEL={new:"新着に戻す",checking:"確認中",accepted:"受注中",hold:"📌 保留",delete:"削除予定",none:"何もしない"};
let settings={swipe_right:"hold",swipe_left:"delete",swipe_tabs:{},sort_rule:{},sort_auto:false,sort_presets:[],sort_active:null};
let state={rejected:false,sort:"score",tab:"new",day:null}; // day(カレンダーで選んだ撮影日)は保存しない
let cases=[],loadedView=null,areaChoices=null;

// ---- 撮影日と Google カレンダー(N9) ----
let cal={configured:false,days:{}};
const DOW="日月火水木金土";
const jstDay=(plus=0)=>new Date(Date.now()+9*36e5+plus*864e5).toISOString().slice(0,10);
const dayLabel=d=>{const t=new Date(`${d}T00:00:00Z`);return `${t.getUTCMonth()+1}/${t.getUTCDate()}(${DOW[t.getUTCDay()]})`};
// AI が読み取った日程(「10/25(土)」「11月3日」「10/25〜26」など)を日付にする。年がなければ投稿日から近い未来の年にする
function caseDates(c){
  const s=String(c.dates||"");if(!s)return [];
  const b=new Date((c.created_at?Date.parse(c.created_at):Date.now())+9*36e5);
  const by=b.getUTCFullYear(),baseMs=Date.UTC(by,b.getUTCMonth(),b.getUTCDate());
  const out=new Set();
  const day=(y,m,d)=>{if(m<1||m>12||d<1||d>31)return null;let yy=y||by,ms=Date.UTC(yy,m-1,d);
    if(!y&&ms<baseMs-60*864e5){yy++;ms=Date.UTC(yy,m-1,d)}
    return new Date(ms).getUTCDate()===d?ms:null};
  const re=/(?:(\d{4})[\/年.\-])?(\d{1,2})[\/月](\d{1,2})(?![\d人名枚件組])日?(?:\s*[(（]([日月火水木金土])?[^)）]{0,3}[)）])?(?:\s*[〜~～\-－]\s*(?:(\d{1,2})[\/月])?(\d{1,2})日?(?![\d:：時]))?/g;
  let m;
  while((m=re.exec(s))&&out.size<14){
    const y=m[1]?+m[1]:0;let start=day(y,+m[2],+m[3]);if(start==null)continue;
    // 曜日が書いてあって合わなければ、次の年の同じ日を試す(年をまたぐ募集のため)
    if(!y&&m[4]&&DOW[new Date(start).getUTCDay()]!==m[4]){const next=day(new Date(start).getUTCFullYear()+1,+m[2],+m[3]);if(next!=null&&DOW[new Date(next).getUTCDay()]===m[4])start=next}
    out.add(new Date(start).toISOString().slice(0,10));
    if(m[6]){const sy=y||new Date(start).getUTCFullYear(),em=m[5]?+m[5]:+m[2];
      let end=day(sy,em,+m[6]);if(end!=null&&end<start)end=day(sy+1,em,+m[6]); // 12/31〜1/2 のように年をまたぐ
      for(let t=start+864e5;end!=null&&t<=end&&t<=start+7*864e5;t+=864e5)out.add(new Date(t).toISOString().slice(0,10))}
  }
  return [...out].sort();
}
// その案件の撮影日に予定があるか。カレンダー未設定・日程不明・範囲外なら null
function calCheck(c){
  if(!cal.configured||cal.error)return null;
  const dates=caseDates(c).filter(d=>(!cal.from||d>=cal.from)&&(!cal.to||d<=cal.to));
  if(!dates.length)return null;
  // 「表示方法: 空き」の予定は出さない。「休み」「有給」などは予定ありに数えず、休みとして出す
  const days=dates.map(d=>{const all=(cal.days[d]||[]).filter(e=>!e.free);return {d,events:all.filter(e=>!e.off),off:all.filter(e=>e.off)}});
  const busy=days.some(x=>x.events.length);
  return {days,busy,off:!busy&&days.some(x=>x.off.length)};
}
function calBadge(c){const k=calCheck(c);return k?`<span class="cal ${k.busy?"busy":"free"}">${k.busy?"予定あり":k.off?"休み":"空き"}</span>`:""}
function calDetail(c){
  const k=calCheck(c);
  if(!k){if(cal.configured&&cal.error)return `<dt>予定</dt><dd class="sub">${esc(cal.error)}</dd>`;return ""}
  const ev=e=>`${esc(e.title)}${e.time?` ${esc(e.time)}`:"(終日)"}`;
  return `<dt>予定</dt><dd>${k.days.map(x=>`<span class="calday">${dayLabel(x.d)} ${x.events.length||x.off.length?[...x.events.map(e=>`<span class="ev">${ev(e)}</span>`),...x.off.map(e=>`<span class="none">${ev(e)}</span>`)].join("、"):'<span class="none">予定なし</span>'}</span>`).join("")}</dd>`;
}

// 撮影場所。前の判定で依頼主のプロフィールから推定した都道府県は、撮影場所としては「場所不明」にする
const shootKnown=c=>!!c.prefecture&&c.prefecture!=="不明"&&c.prefecture_source!=="プロフィール";
function place(c){return shootKnown(c)?c.prefecture:"場所不明"}
// 都道府県をどこから判断したか。本文以外は、カードでも分かるように短く付ける
const PLACE_FROM={"本文":"本文から","イベント表":"イベント表から","イベント推定":"イベントの開催地をAIが推定","画像":"画像から"};
const PLACE_TAG={"イベント表":"イベント","イベント推定":"推定","画像":"画像"};
function placeShort(c){const k=shootKnown(c)?c.prefecture_source:"";return PLACE_TAG[k]?`${place(c)}・${PLACE_TAG[k]}`:place(c)}
function placeFrom(c){const k=shootKnown(c)?c.prefecture_source:"";return PLACE_FROM[k]?`(${PLACE_FROM[k]})`:""}
// プロフィールから読み取った年齢と活動地域(依頼主の名前の横に小さく出す)
// どこから読んだか。プロフィールに書いてない項目だけリンク先(Litlink など)から読む
function profileFrom(c){
  const items=[["年齢",c.age,c.age_from],["活動地域",(c.areas||[]).length,c.areas_from],["性別",c.gender,c.gender_from]].filter(i=>i[1]);
  const link=items.filter(i=>i[2]==="link").map(i=>i[0]);
  if(!link.length)return "プロフィールから";
  return link.length<items.length?`${link.join("と")}はリンク先から`:"リンク先から";
}

// iPhone では overflow:hidden だけでは後ろのホームが指で動いてしまうので、シートの外での指の動きは止める。
// (body を position:fixed で止めると、上部の固定表示が一瞬消えるので使わない)
let locked=false;
function lockScroll(){if(locked)return;locked=true;document.documentElement.style.overflow=document.body.style.overflow="hidden"}
function unlockScroll(){if(!locked)return;locked=false;document.documentElement.style.overflow=document.body.style.overflow="";lastY=window.scrollY}
document.addEventListener("touchmove",ev=>{
  if(!locked||!ev.cancelable||ev.target.closest("#viewer"))return;
  const sheet=ev.target.closest(".sheet");
  // シートの外、または中身がスクロールしないシートの上では、ページを動かさない
  if(!sheet||sheet.scrollHeight<=sheet.clientHeight+1)ev.preventDefault();
},{passive:false});
// html = シートの中身。すでに開いていれば動かさずに中身だけ入れ替える。開ききったら resolve する
function presentSheet(html,label,cls=""){
  const root=$("sheetRoot");const already=!root.hidden&&root.querySelector(".sheet.in");

// スワイプで付ける状態は、今見ている状態タブごとに設定で決める。
// 設定の状態をすでに付けているカードをスワイプしたら、その状態を外して新着に戻す
function swipeTarget(c,dir){
  const side=dir>0?"right":"left";
  const want=(settings.swipe_tabs?.[state.tab]||{})[side]||settings[dir>0?"swipe_right":"swipe_left"];
  if(!want||want==="none"||(want==="new"&&c.review==="new"))return null;
  if(want==="new")return {state:"new",label:SWIPE_LABEL.new,cls:"new"};
  if(c.review===want)return {state:"new",label:`${SWIPE_LABEL[want]}を外す`,cls:"new"};
  return {state:want,label:SWIPE_LABEL[want],cls:want};
}
// カードの横スワイプ。指の動き始めで縦か横かを1回だけ決め、そのジェスチャーの間は変えない。
// 横に決まったら画面のスクロールを止め、縦に決まったらスワイプはしない(斜めの動きで両方が動かないように)
let drag=null,suppressClick=false;
const LOCK=10;  // この距離(px)動いたら向きを決める
function startDrag(card,x,y){drag={card,x,y,dx:0,axis:null}}
function moveDrag(x,y){
  if(!drag)return false;
  const dx=x-drag.x,dy=y-drag.y;
  if(!drag.axis){
    if(Math.hypot(dx,dy)<LOCK)return false;
    // 横は、横の動きが縦の1.5倍を超えたときだけ。迷う角度はスクロールを優先
    if(Math.abs(dx)>Math.abs(dy)*1.5){drag.axis="x";drag.x=x;drag.card.classList.add("dragging")}
    else{drag=null;return false}
  }
  drag.dx=x-drag.x;
  const c=cases.find(v=>v.id===drag.card.dataset.id);const t=c&&swipeTarget(c,drag.dx);
  const bg=drag.card.previousElementSibling;const far=Math.abs(drag.dx)>swipeFar(drag.card);
  bg.className=`swipe-bg ${t?t.cls:""} ${drag.dx>0?"toR":"toL"} ${t&&far?"ready":""}`;
  bg.querySelector(drag.dx>0?".l":".r").textContent=t?(far?`離すと${t.label}`:t.label):"設定なし";
  drag.card.style.transform=`translateX(${t?drag.dx:drag.dx/4}px)`;
  return true;
}
const swipeFar=card=>Math.min(110,card.offsetWidth*.3);
function endDrag(commit){
  const d=drag;drag=null;if(!d||!d.axis)return;
  suppressClick=true;setTimeout(()=>suppressClick=false,80);
  const c=cases.find(x=>x.id===d.card.dataset.id);const t=c&&swipeTarget(c,d.dx);
  d.card.classList.add("snap");
  if(t&&commit&&Math.abs(d.dx)>swipeFar(d.card)){
    d.card.style.transform=`translateX(${d.dx>0?"":"-"}110%)`;
    setTimeout(()=>applySwipe(c,t),180);
  }else{d.card.style.transform="";setTimeout(()=>{d.card.classList.remove("snap","dragging");d.card.previousElementSibling.className="swipe-bg"},220)}
}

  <p>点数は Notion の【3】点数表だけで決まります。区分ごとに、種類・撮影場所の都道府県(読めなければ本文の地名)・本文に出てくる語・作品・イベントに当たった行の点を足し、プラスの点のときは依頼主の FF率(フォロワー数÷フォロー数)を倍率として掛けます(0.5〜1.5倍。幅は【4】基本設定で変えられる)。点数は −100〜+100 で、内訳は詳細で見られます。点数表に当たった作品は、カードの「作品」の行に点が出ます(マイナスは赤)。点数表を変えると、そのあとに取得したポストから新しい点数になります。</p>
  <p>日程の横の「予定あり / 空き / 休み」は Google カレンダーとの照合です。依頼主の名前の横には、プロフィールから読んだ性別・年齢が出ます(未成年は赤)。活動地域はカードの「活動地域」の行に出ます(書いていない人は「記載なし」)。</p>
  <p>一番上で下に引っぱると再読み込みします。下へスクロールすると上部がたたまれます。</p>`],
 ["仕分け",`<p>ホームの「仕分け」から、要らない案件をまとめて削除予定に移せます。チェックした値に1つでも当てはまる新着が移ります(確認中・受注中・保留は動かしません)。</p>

  <li><b>点数</b>: 数字を入れると、その点数以下(ちょうどその点数も含む)の新着が当てはまります(例: −50)。空欄なら使いません。対象外にしたい作品は点数表で大きなマイナスにしておくと、ここで削除予定に回せます。</li>

  <li><b>撮影場所</b>はスタジオや会場の都道府県(本文・イベントの一覧・画像から)です。イベントの一覧にないイベントは、AIが知っている開催地を使い(カードに「推定」)、そのイベントを一覧に足します。間違いは Notion の一覧で直すと次から使われます。47都道府県を地方ごとの行で最初から全部並べ、分からない案件は「不明」です。「たたむ」で今ある値だけになります。<b>撮影日の予定</b>は Google カレンダーとの照合で、つながっているときだけ出ます(休みの予定は「休み」)。</li>
  <li><b>開いたときに自動で仕分ける</b>: オンにすると、アプリを開くたび(引っぱって再読み込みしたときも)、当てはまる新着を削除予定に移し、件数を下に出します。「元に戻す」で戻した案件や、一度でも状態を変えた案件は、次からは自動では移しません。</li>
  <li><b>ホームの仕分けボタン</b>: チェックがあるとき、使っているプリセットの名前(なければ「プリセットなし」)と、開いたときに自動で移すなら赤い「自動」、移さないなら「手動」が出ます。</li>
  <li><b>今すぐ削除予定にする</b>: 今の新着で当てはまるものを全部移します。あとから「元に戻す」で戻せます。</li>
  <li><b>プリセット</b>: 選べるのは1つだけで、タップするとそのチェックに切り替わります。選んだあとにチェックを変えると「プリセットなし」になり、「＋ 新しいプリセットとして保存」で名前を付けて保存できます(同じ名前は上書き)。× で消せます。チェックとプリセットはどの端末でも同じです。</li></ul>`],
 ["並び順・日付",`<ul><li><b>並び順</b>: 点数順・新着順・FF率順・フォロワー数順。</li>
  <li><b>日付</b>: 月のカレンダーが開き、日ごとに「その日が撮影日の案件の数」(青い数字、今のタブで数える)と Google カレンダーの予定(休みは緑)が出ます。日をタップすると、その日が撮影日の案件だけを一覧に出します。上の「解除」で戻ります。予定は今日から120日先まで出ます。</li></ul>`],
 ["案件の詳細",`<p>カードをタップすると詳細が開きます。本文をタップすると X アプリでそのポストが開きます。一番上で下に引っぱると閉じます。</p>
  <p>下のボタンで「確認中」「受注中」「保留」「削除予定」にできます。その状態のときにもう一度押すと外れて新着に戻ります。スパム・虚偽の申告・カメラマンだった人などは「ブラックリストにいれる」で、これまでとこれからのポストを出さず、AI の判定にもかけません(設定の「ブラックリスト」から解除できます)。</p>
  <p>場所(都道府県)は、本文 → Notion の「イベントの一覧」→ 添付画像 の順に判断し、本文以外から判断したときはカードに小さく出ます。依頼主のプロフィールからは決めません(分からないときは「場所不明」)。添付画像(メンバー表など)から読んだ X のアカウントは「関係するアカウント」に「画像から」と出ます。</p>
  <p>依頼主の年齢・活動地域・性別は、プロフィールに書いてある書き方(18↓、30↑、成人済み、関西、♀ など)から読みます。プロフィールに書いてないときは、プロフィールのリンク先(Litlink など)からも読み、「リンク先から」と出ます。</p>`],
 ["スワイプ",`<p>カードを左右にスワイプすると、設定で選んだ状態を付けられます。割り当ては状態タブごとに決められます(設定の「スワイプ(状態タブごと)」)。初期値は右=保留、左=削除予定です(保留のタブの右と、削除予定のタブの左は「新着に戻す」)。</p>

  <li>付けたい状態がもう付いているカードをスワイプすると、その状態が外れて新着に戻ります。</li>

 ["Google カレンダーのつなぎ方",`<p>Google カレンダーの「設定」→ 予定表を選ぶ →「iCal 形式の非公開 URL」をコピーし、GitHub のリポジトリの Settings → Secrets and variables → Actions に、名前 GCAL_ICS_URL で登録します(チャットには貼らないでください)。次に X Finder を公開し直すと使えます。複数の予定表は改行で区切って入れられます。</p>
  <p>予定は X Finder の中で見るだけで、保存しません。予定名に「休み」「有給」などの言葉(Notion の基本設定「休みとみなす予定の言葉」)が入っている予定は、予定ありに数えず「休み」と出します。</p>`],

// ---- カレンダーから日付を選ぶ ----
// Google カレンダーそのものを埋め込むと、タップした日をこの画面で受け取れないので、同じ予定(iCal)でこの画面に月の表を描く。
// 日ごとに「その日が撮影日の案件の数」と予定を出し、日をタップするとその日の案件だけの一覧にする。
let calView=null; // {y, m}(m は 0〜11)
function dayCounts(){
  const saved=state.day;state.day=null;
  const n={};for(const c of matching().filter(c=>c.review===state.tab))for(const d of caseDates(c))n[d]=(n[d]||0)+1;
  state.day=saved;return n;
}
function openCalendar(){
  const base=state.day||jstDay(0);calView={y:+base.slice(0,4),m:+base.slice(5,7)-1};
  presentSheet(`<div class="grab"></div><div id="calBody"></div>`,"カレンダーから日付を選ぶ");renderCalendar();
}
function renderCalendar(){
  const {y,m}=calView,counts=dayCounts(),today=jstDay(0),tab=TABS.find(t=>t.k===state.tab);
  const first=new Date(Date.UTC(y,m,1)).getUTCDay(),days=new Date(Date.UTC(y,m+1,0)).getUTCDate();
  const iso=d=>`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  const evs=d=>(cal.days&&cal.days[d]||[]).filter(e=>!e.free);
  let cells="";
  for(let i=0;i<first;i++)cells+='<span class="cd empty"></span>';
  for(let d=1;d<=days;d++){
    const k=iso(d),n=counts[k]||0,e=evs(k),busy=e.filter(x=>!x.off),off=e.filter(x=>x.off);
    const dow=(first+d-1)%7;
    cells+=`<button type="button" class="cd${k<today?" past":""}${k===today?" today":""}${k===state.day?" sel":""}${dow===0?" sun":dow===6?" sat":""}" data-cal-day="${k}" aria-label="${dayLabel(k)} 案件${n}件${busy.length?" 予定あり":off.length?" 休み":""}">
      <span class="dn">${d}</span>${n?`<span class="cn">${n}</span>`:""}
      ${busy.slice(0,2).map(x=>`<span class="ce">${esc(x.title)}</span>`).join("")}${busy.length>2?`<span class="cm">+${busy.length-2}</span>`:""}
      ${!busy.length&&off.length?`<span class="ce off">${esc(off[0].title)}</span>`:""}</button>`;
  }
  const prev=m?{y,m:m-1}:{y:y-1,m:11},next=m<11?{y,m:m+1}:{y:y+1,m:0};
  const note=!cal.configured?"Google カレンダーがつながっていないので、案件の数だけ出しています。":`予定を読めませんでした(${esc(cal.error||"")})。案件の数だけ出しています。`;
  $("calBody").innerHTML=`<div class="calhead"><button type="button" class="icon-btn" data-cal-move="${prev.y}-${prev.m}" aria-label="前の月">‹</button>
     <h2>${y}年${m+1}月</h2><button type="button" class="icon-btn" data-cal-move="${next.y}-${next.m}" aria-label="次の月">›</button></div>
   ${cal.configured&&!cal.error?"":`<p class="sub">${note}</p>`}
   <div class="calgrid">${[..."日月火水木金土"].map((w,i)=>`<span class="cw${i===0?" sun":i===6?" sat":""}">${w}</span>`).join("")}${cells}</div>
   <div class="actions">${state.day?'<button type="button" class="btn" data-day-clear="1">日付の絞り込みを解除</button>':""}<button class="btn" data-close="1">閉じる</button></div>`;
}

// ---- 仕分け ----
// 項目ごとに、今の案件にある値を件数つきで並べる(件数は新着で数える)。チェックはすぐ保存する(どの端末でも同じ)
const facetVals=(f,c)=>{const v=f.v(c);return Array.isArray(v)?v:[v]};
const usedFacets=()=>SORT_FACETS.filter(f=>!f.show||f.show());
// 仕分けに当てはまるか(チェックした値のどれか1つ。活動地域だけは全部にチェックがあるとき)
function sortHit(c,rule=settings.sort_rule){
  return usedFacets().some(f=>{const on=rule[f.k];if(!on||!on.length)return false;
    if(f.num){const max=parseFloat(on[0]);return Number.isFinite(max)&&c.score!=null&&c.score<=max}
    const vals=facetVals(f,c);return f.all?vals.every(v=>on.includes(v)):vals.some(v=>on.includes(v))});
}
const checkedCount=()=>usedFacets().reduce((n,f)=>n+(settings.sort_rule[f.k]||[]).length,0);
const ruleKey=r=>JSON.stringify(SORT_FACETS.map(f=>[...(r[f.k]||[])].sort()));
function facetValues(f){
  const n=new Map();
  for(const c of cases)if(c.review==="new")for(const v of facetVals(f,c))n.set(v,(n.get(v)||0)+1);
  for(const v of settings.sort_rule[f.k]||[])if(!n.has(v))n.set(v,0); // チェックした値は、今の新着になくても出す(外せるように)
  const ord=SORT_ORDER[f.k]||[],rank=v=>NA_VALUES.includes(v)?2:ord.includes(v)?0:1;
  return [...n].sort((a,b)=>rank(a[0])-rank(b[0])||ord.indexOf(a[0])-ord.indexOf(b[0])||b[1]-a[1]||a[0].localeCompare(b[0],"ja"));
}
// 活動地域・撮影場所・年齢は、選べる値を最初から全部並べる(活動地域と撮影場所は地方ごとの行)。数が多いので小さめにする。
// 活動地域と撮影場所は「たたむ」と、今の新着にある値とチェックした値だけにする(この端末に覚える)
const FOLD_KEYS={area:"finder-area-open",shoot:"finder-shoot-open"};
const foldOpen=k=>{try{return localStorage.getItem(FOLD_KEYS[k])!=="0"}catch(e){return true}};
const prefShort=p=>p==="北海道"?p:p.replace(/[都府県]$/,"");
// 項目ごとの並べ方: [{見出し, 行: [[行の名前, 値の配列]]}]。最後の値は書いていない・分からない案件
function fullSections(k){
  if(k==="age")return {sections:[{title:"",rows:[["",["未成年",...AGE_BUCKETS,AGE_ADULT]]]}],na:"記載なし"};
  if(!areaChoices)return null;
  const prefs=areaChoices.blocks;
  if(k==="area")return {sections:[{title:"地方",rows:[["",areaChoices.regions]]},{title:"都道府県",rows:prefs},{title:"都市",rows:[["",areaChoices.cities]]}],na:"記載なし"};
  if(k==="shoot")return {sections:[{title:"",rows:prefs}],na:"不明"};
  return null;
}
function fullItem(f,{sections,na}){
  const counts=new Map(facetValues(f)),on=settings.sort_rule[f.k]||[],fold=!!FOLD_KEYS[f.k],open=!fold||foldOpen(f.k);
  const prefSet=new Set((areaChoices?.blocks||[]).flatMap(b=>b[1]));
  const chip=v=>{const n=counts.get(v)||0;
    return `<button type="button" class="v sm${n?"":" zero"}${NA_VALUES.includes(v)?" na":""}" data-sv="${f.k}" data-val="${esc(v)}" aria-pressed="${on.includes(v)}" aria-label="${esc(v)} ${n}件"><i></i>${esc(prefSet.has(v)?prefShort(v):v)}${n?`<small>${n}</small>`:""}</button>`};
  const head=`<div class="sort-ihead"><h3>${f.t}</h3>${fold?`<button type="button" class="linkbtn" data-fold="${f.k}">${open?"たたむ":"すべて出す"}</button>`:""}</div>`;
  if(!open)return `<div class="sort-item">${head}<div class="vals">${[...counts].map(([v])=>chip(v)).join("")||'<span class="sub">新着がありません</span>'}</div></div>`;
  const known=new Set(sections.flatMap(s=>s.rows.flatMap(r=>r[1])));
  const row=(label,vals)=>`<div class="arow"><span class="alabel">${label}</span><div class="vals">${vals.map(chip).join("")}</div></div>`;
  const rest=[...new Set([...counts.keys(),na])].filter(v=>!known.has(v));
  return `<div class="sort-item">${head}
    ${sections.map(s=>`${s.title?`<div class="asub">${s.title}</div>`:""}${s.rows.map(([l,vals])=>row(l,vals)).join("")}`).join("")}
    ${rest.length?`${sections.length>1?'<div class="asub">その他</div>':""}${row(sections.length>1?"":"その他",rest)}`:""}</div>`;
}
// 点数の項目: 数字を入れると、その点数以下の新着が当てはまる。空欄なら使わない
function scoreItem(f,news){
  const v=(settings.sort_rule[f.k]||[])[0]??"",max=parseFloat(v);
  const n=Number.isFinite(max)?news.filter(c=>c.score!=null&&c.score<=max).length:0;
  return `<div class="sort-item"><h3>${f.t}</h3><label class="score-max"><input type="number" inputmode="numeric" step="1" min="-999" max="999" data-score-max="${f.k}" value="${esc(v)}" placeholder="例: -50" aria-label="この点数以下の新着を削除予定にする">点以下
    <span class="sub">${Number.isFinite(max)?`今の新着で ${n}件`:"空欄なら使いません"}</span></label></div>`;
}
function setScoreMax(k,raw){
  const t=String(raw).trim(),n=parseFloat(t),rule={...settings.sort_rule};
  if(t===""||!Number.isFinite(n))delete rule[k];else rule[k]=[String(Math.round(n))];
  if(ruleKey(rule)===ruleKey(settings.sort_rule)){renderSort();return}
  saveSort({sort_rule:rule,sort_active:null}); // 数字を変えたら、プリセットを使っていない状態になる
}
function openSort(){
  presentSheet(`<div class="grab"></div><h2>仕分け</h2><p class="sub" style="margin:0">チェックした値に1つでも当てはまる新着は、削除予定に移ります</p><div id="sortBody"></div>`,"仕分け");
  renderSort();
}
function renderSort(){
  const body=$("sortBody");if(!body)return;
  const rule=settings.sort_rule;
  const news=cases.filter(c=>c.review==="new"),hits=news.filter(c=>sortHit(c)).length;
  const item=f=>{const vals=facetValues(f),on=rule[f.k]||[];
    return `<div class="sort-item"><h3>${f.t}</h3><div class="vals">${vals.length?vals.map(([v,n])=>`<button type="button" class="v${NA_VALUES.includes(v)?" na":""}" data-sv="${f.k}" data-val="${esc(v)}" aria-pressed="${on.includes(v)}"><i></i>${esc(v)}<small>${n}</small></button>`).join(""):'<span class="sub">新着がありません</span>'}</div></div>`};
  const act=activePreset();
  body.innerHTML=`<div class="sort-presets">${settings.sort_presets.map((p,i)=>`<span class="preset${p===act?" on":""}"><button type="button" class="chip" data-preset="${i}" aria-pressed="${p===act}">${esc(p.name)}</button><button type="button" class="pdel" data-preset-del="${i}" aria-label="${esc(p.name)}を消す">×</button></span>`).join("")}
     ${act?"":`<button type="button" class="chip add" data-preset-save="1">＋ ${settings.sort_presets.length?"新しいプリセットとして保存":"今のチェックを保存"}</button>`}</div>
   ${["依頼主","案件"].map(g=>`<div class="sort-grp">${g}</div>${usedFacets().filter(f=>f.g===g).map(f=>{if(f.num)return scoreItem(f,news);const fs=fullSections(f.k);return fs?fullItem(f,fs):item(f)}).join("")}`).join("")}

// 先に画面を変えてから保存する。続けて押したときは、最後に送った分の返事だけを使う
let sortSeq=0;
async function saveSort(body){
  const prev=settings,seq=++sortSeq;
  settings={...settings,...body};renderSort();renderControls();
  try{const r=await postJson("/api/settings",body);if(seq===sortSeq)settings=r}
  catch(e){if(seq===sortSeq){settings=prev;renderSort();renderControls()}showToast(`保存できませんでした(${e.message})`)}
}
function toggleSortValue(k,v){
  const on=new Set(settings.sort_rule[k]||[]);on.has(v)?on.delete(v):on.add(v);
  const rule={...settings.sort_rule,[k]:[...on]};if(!on.size)delete rule[k];
  saveSort({sort_rule:rule,sort_active:null}); // チェックを変えたら、プリセットを使っていない状態になる
}
// 選べるプリセットは1つだけ。選んだあとにチェックを変えたものは、選んでいないことにする
function activePreset(){
  const p=settings.sort_presets.find(x=>x.name===settings.sort_active);
  return p&&ruleKey(p.rule)===ruleKey(settings.sort_rule)?p:null;
}
function presetPick(i){
  const p=settings.sort_presets[i];if(!p||p===activePreset())return;
  saveSort({sort_rule:p.rule,sort_active:p.name});
}
function presetSave(){
  const name=(prompt("新しいプリセットの名前","")||"").trim().slice(0,20);if(!name)return;
  if(settings.sort_presets.some(p=>p.name===name)&&!confirm(`「${name}」はもうあります。今のチェックで上書きしますか`))return;
  saveSort({sort_presets:[...settings.sort_presets.filter(p=>p.name!==name),{name,rule:settings.sort_rule}].slice(-20),sort_active:name});
}
function presetDelete(i){
  const p=settings.sort_presets[i];if(!p||!confirm(`プリセット「${p.name}」を消しますか`))return;
  saveSort({sort_presets:settings.sort_presets.filter((_,j)=>j!==i),...(p.name===settings.sort_active?{sort_active:null}:{})});
}
// 削除予定に移して「元に戻す」を出す。移した案件は、このあと自動では動かさない(touched)
async function moveToDelete(ids,msg){
  try{await postJson("/api/reviews",{ids,state:"delete"})}
  catch(e){showToast(`削除予定にできませんでした(${e.message})`);return}
  ids.forEach(id=>{const c=cases.find(x=>x.id===id);if(c){c.review="delete";c.touched=true}});
  render();
  showToast(msg,async()=>{
    ids.forEach(id=>setLocalReview(id,"new"));render();
    try{await postJson("/api/reviews",{ids,state:"new"})}catch(e){showToast(`元に戻せませんでした(${e.message})`);load()}
  });
}
function sortRun(){
  const ids=cases.filter(c=>c.review==="new"&&sortHit(c)).map(c=>c.id);if(!ids.length)return;
  closeSheet();moveToDelete(ids,`${ids.length}件を削除予定にしました`);
}
// 開いたときの自動の仕分け。まだ一度も状態を変えていない新着だけ(元に戻した案件は、次に開いたときも動かさない)
let autoBusy=false;
async function autoSort(){
  if(autoBusy||!settings.sort_auto||!checkedCount())return;
  const ids=cases.filter(c=>c.review==="new"&&!c.touched&&sortHit(c)).map(c=>c.id);if(!ids.length)return;
  autoBusy=true;
  try{await moveToDelete(ids,`開いたので ${ids.length}件を削除予定にしました`)}finally{autoBusy=false}
}

let statsDays=30;

const yen2=n=>n<10?`¥${(n||0).toFixed(2)}`:yen(n);
function barChart(daily,series,{fmt=v=>Math.round(v),goal=null}={}){
  const W=340,H=140,L=30,B=18,T=8,w=W-L-4,h=H-B-T,n=daily.length;
  const tot=d=>series.reduce((a,s)=>a+(d[s.key]||0),0);
  const top=Math.max(...daily.map(tot),0);
  // 目標の線が棒よりずっと上にあると棒がつぶれるので、そのときは線を描かず凡例に書く
  const showGoal=goal&&goal<=top*1.6;
  const max=Math.max(showGoal?goal:0,top,1e-9)*1.05;
  const bw=w/n,gap=Math.min(2,bw*.25);
  let bars="";
  daily.forEach((d,i)=>{let y=T+h;for(const s of series){const v=d[s.key]||0;if(!v)continue;const bh=v/max*h;y-=bh;
    bars+=`<rect x="${(L+i*bw+gap/2).toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(.5,bw-gap).toFixed(1)}" height="${bh.toFixed(1)}" fill="${s.color}" rx="1"><title>${d.date} ${s.label} ${fmt(v)}</title></rect>`}});
  const gy=showGoal?T+h-goal/max*h:null;
  const md=s=>s.slice(5).replace("-","/");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">
    <line x1="${L}" x2="${W-4}" y1="${T+h}" y2="${T+h}" stroke="var(--line)"/>
    <text x="${L-4}" y="${T+8}" text-anchor="end">${esc(fmt(top))}</text><text x="${L-4}" y="${T+h}" text-anchor="end">0</text>
    ${bars}
    ${gy!=null?`<line x1="${L}" x2="${W-4}" y1="${gy.toFixed(1)}" y2="${gy.toFixed(1)}" stroke="var(--warn)" stroke-dasharray="4 3"/><text x="${W-4}" y="${(gy-3).toFixed(1)}" text-anchor="end" style="fill:var(--warn)">目標/日</text>`:""}
    <text x="${L}" y="${H-4}">${md(daily[0].date)}</text><text x="${W-4}" y="${H-4}" text-anchor="end">${md(daily[n-1].date)}</text></svg>
    <div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${s.label}</span>`).join("")}${goal?`<span style="color:var(--warn)">目標 ${esc(fmt(goal))}/日${showGoal?"":"(グラフより上)"}</span>`:""}</div>`;
}
function hbars(rows){
  if(!rows.length)return '<p class="sub" style="margin:0">まだありません</p>';
  const max=Math.max(...rows.map(r=>r.n));
  return `<div class="hbars">${rows.map(r=>`<div class="hbar"><span class="t">${esc(r.k)}</span><span><span class="b" style="display:block;width:${Math.max(2,r.n/max*100)}%"></span></span><span class="n">${r.n}</span></div>`).join("")}</div>`;
}

// 画像を上か下にスワイプしても閉じる。横の動きは画像送りに任せる
let vdrag=null;
$("viewer").addEventListener("touchstart",ev=>{
  if(ev.touches.length>1){vdrag=null;return}
  vdrag={x:ev.touches[0].clientX,y:ev.touches[0].clientY,dy:0,axis:null,t:Date.now()};
},{passive:true});
$("viewer").addEventListener("touchmove",ev=>{
  if(!vdrag)return;
  if(ev.touches.length>1){vdrag=null;resetViewerDrag();return}
  const dx=ev.touches[0].clientX-vdrag.x,dy=ev.touches[0].clientY-vdrag.y;
  if(!vdrag.axis){
    if(Math.hypot(dx,dy)<LOCK)return;
    vdrag.axis=Math.abs(dy)>Math.abs(dx)?"y":"x";
    if(vdrag.axis==="x"){vdrag=null;return}
    vdrag.y=ev.touches[0].clientY;
  }
  if(ev.cancelable)ev.preventDefault();
  vdrag.dy=ev.touches[0].clientY-vdrag.y;
  const strip=$("strip");strip.style.transition="none";strip.style.transform=`translateY(${vdrag.dy}px)`;
  $("viewer").style.background=`rgba(0,0,0,${Math.max(.25,1-Math.abs(vdrag.dy)/400)})`;
},{passive:false});
function resetViewerDrag(){const strip=$("strip");strip.style.transition="transform .2s";strip.style.transform="";$("viewer").style.background=""}
$("viewer").addEventListener("touchend",ev=>{
  const d=vdrag;vdrag=null;if(!d||d.axis!=="y")return;
  ev.preventDefault();  // このあとのタップ扱い(click)を出さない
  const fast=Math.abs(d.dy)/Math.max(1,Date.now()-d.t)>.5;
  if(Math.abs(d.dy)>90||(fast&&Math.abs(d.dy)>30)){
    const strip=$("strip");strip.style.transition="transform .18s";strip.style.transform=`translateY(${d.dy>0?"":"-"}100%)`;
    setTimeout(()=>{closeViewer();strip.style.transition="";strip.style.transform="";$("viewer").style.background=""},180);
  }else resetViewerDrag();
});
$("viewer").addEventListener("touchcancel",()=>{vdrag=null;resetViewerDrag()});
$("sort").addEventListener("change",e=>{state.sort=e.target.value;save();render()});
document.addEventListener("change",e=>{const i=e.target.closest&&e.target.closest("[data-score-max]");if(i)setScoreMax(i.dataset.scoreMax,i.value)});
// ---- スクロールの向きで上部をたたむ・広げる ----
// たたむと上部が低くなってページの位置がずれるので、切り替えたあとの動きが落ち着くまでは向きを見ない(行ったり来たりしないように)
let lastY=window.scrollY,moved=0,slimHold=0;
function setSlim(on){const h=document.querySelector("header.top");if(h.classList.contains("slim")===on)return;
  h.classList.toggle("slim",on);slimHold=Date.now()+320;moved=0}
window.addEventListener("scroll",()=>{
  if(locked)return;
  const y=window.scrollY,dy=y-lastY;lastY=y;
  if(y<=40){setSlim(false);return}
  // 一番下で勢い余ってはね返る動き(行き過ぎて少し戻る)は、上へのスクロールとして数えない
  const maxY=document.documentElement.scrollHeight-window.innerHeight;
  if(y>=maxY-60){moved=0;return}
  if(Date.now()<slimHold)return;
  moved=(Math.sign(dy)===Math.sign(moved))?moved+dy:dy;
  if(moved>24)setSlim(true);else if(moved<-24)setSlim(false);
},{passive:true});
// ---- 詳細などのシートを、一番上までスクロールしたあとさらに下へ引っぱると閉じる ----
// なめらかにするため: 動き始めをすぐ捕まえる(中身が先に少し動いてから切り替わるガクつきをなくす)、
// 描く回数を画面の更新に合わせる、離したときは指の速さを引き継いで閉じる / 戻す
let sd=null;
const SHEET_EASE_OUT="cubic-bezier(.2,.8,.3,1)";
function sheetPaint(){if(!sd||!sd.on)return;sd.raf=0;
  sd.sheet.style.transform=`translate3d(0,${sd.dy}px,0)`;
  if(sd.scrim)sd.scrim.style.opacity=String(Math.max(0,1-sd.dy/sd.h))}
$("sheetRoot").addEventListener("touchstart",ev=>{
  const sheet=ev.target.closest(".sheet");sd=null;
  // 一番上にいる状態で始めた指の動きだけ(スクロールの勢いのまま閉じてしまわないように)
  if(!sheet||ev.touches.length>1||sheet.scrollTop>0)return;
  const t=ev.touches[0];
  sd={sheet,scrim:$("sheetRoot").querySelector(".scrim"),x:t.clientX,y:t.clientY,dy:0,on:false,pts:[],raf:0,h:sheet.offsetHeight};
},{passive:true});
$("sheetRoot").addEventListener("touchmove",ev=>{
  if(!sd)return;
  const t=ev.touches[0],dx=t.clientX-sd.x,dy=t.clientY-sd.y;
  if(!sd.on){
    if(Math.abs(dx)<3&&Math.abs(dy)<3)return;
    // 下向きが横より大きいときだけ。上向き(中身のスクロール)や横はふつうに任せる
    if(dy<=0||Math.abs(dx)>Math.abs(dy)||sd.sheet.scrollTop>0){sd=null;return}
    sd.on=true;sd.y=t.clientY;
    sd.sheet.style.transition="none";sd.sheet.classList.add("drag");
    if(sd.scrim)sd.scrim.style.transition="none";
  }
  if(ev.cancelable)ev.preventDefault();
  sd.dy=Math.max(0,t.clientY-sd.y);
  const now=performance.now();sd.pts.push([now,sd.dy]);while(sd.pts.length>2&&now-sd.pts[0][0]>100)sd.pts.shift();
  if(!sd.raf)sd.raf=requestAnimationFrame(sheetPaint);
},{passive:false});
function sheetDragEnd(cancel){
  const d=sd;sd=null;if(!d||!d.on)return;
  if(d.raf)cancelAnimationFrame(d.raf);
  const [t0,y0]=d.pts[0]||[0,0],[t1,y1]=d.pts[d.pts.length-1]||[1,0];
  const v=(y1-y0)/Math.max(1,t1-t0);  // px/ms、下向きが正
  const close=!cancel&&(d.dy>Math.min(120,d.h*.22)||(v>.4&&d.dy>24));
  const target=close?d.h+20:0;
  // 残りの距離を指の速さで進む時間。速く払えば速く閉じる
  const ms=Math.round(Math.min(320,Math.max(160,Math.abs(target-d.dy)/Math.max(.8,Math.abs(v)))));
  d.sheet.style.transition=`transform ${ms}ms ${SHEET_EASE_OUT}`;
  d.sheet.style.transform=`translate3d(0,${target}px,0)`;
  if(d.scrim){d.scrim.style.transition=`opacity ${ms}ms linear`;d.scrim.style.opacity=close?"0":""}
  setTimeout(()=>{
    if(close){closeSheet();return}
    d.sheet.style.transition="";d.sheet.style.transform="";d.sheet.classList.remove("drag");
    if(d.scrim)d.scrim.style.transition="";
  },ms+20);
}
$("sheetRoot").addEventListener("touchend",()=>sheetDragEnd(false));
$("sheetRoot").addEventListener("touchcancel",()=>sheetDragEnd(true));
// ---- 引っぱって再読み込み(一番上にいるときだけ。開いている詳細や画像の上では動かない) ----
const PTR_GO=64;let ptr=null,ptrBusy=false;
function ptrShow(h,txt){const el=$("ptr");el.classList.toggle("back",h===0||txt==="busy");el.style.height=`${h}px`;
  $("ptrText").innerHTML=txt==="busy"?'<span class="spin">↻</span> 読み込み中…':esc(txt||"")}
document.addEventListener("touchstart",ev=>{
  ptr=null;
  if(ptrBusy||ev.touches.length>1||window.scrollY>0||!$("sheetRoot").hidden||!$("viewer").hidden)return;
  ptr={y:ev.touches[0].clientY,x:ev.touches[0].clientX,h:0,on:false};
},{passive:true});
document.addEventListener("touchmove",ev=>{
  if(!ptr)return;
  const dy=ev.touches[0].clientY-ptr.y,dx=ev.touches[0].clientX-ptr.x;
  if(!ptr.on){
    if(Math.hypot(dx,dy)<LOCK)return;
    // 下向きで、縦の動きのほうが大きく、カードの横スワイプが始まっていないときだけ
    if(dy<=0||Math.abs(dx)>=Math.abs(dy)||(drag&&drag.axis)||window.scrollY>0){ptr=null;return}
    ptr.on=true;ptr.y=ev.touches[0].clientY;
  }
  if(ev.cancelable)ev.preventDefault();
  ptr.h=Math.max(0,Math.min(96,(ev.touches[0].clientY-ptr.y)*.5));
  ptrShow(ptr.h,ptr.h>=PTR_GO?"↑ 離すと再読み込み":"↓ 引っぱって再読み込み");
},{passive:false});
async function ptrEnd(){
  const p=ptr;ptr=null;if(!p||!p.on)return;
  if(p.h<PTR_GO){ptrShow(0);return}
  ptrBusy=true;ptrShow(44,"busy");
  try{await load()}finally{ptrBusy=false;ptrShow(0)}
}
document.addEventListener("touchend",ptrEnd);
document.addEventListener("touchcancel",()=>{ptr=null;ptrShow(0)});
$("openSettings").addEventListener("click",openSettings);
$("openSort").addEventListener("click",openSort);
$("openCal").addEventListener("click",openCalendar);
$("cost").addEventListener("click",openStats);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&$("sheetRoot").hidden)load()});
renderControls();load();
</script>
