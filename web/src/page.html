<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ファインダー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* N13 ファインダー: スマホ1列。上に絞り込みと並び順、点数つきのカード、タップで下から詳細。 */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#eaeef4; --line:#d9dfe8;
  --fg:#141a24; --muted:#5d6878; --accent:#2b54d6; --accent-soft:#e3e9fb;
  --rec:#e2372b; --rec-soft:#fde6e3; --ok:#1d8a55; --ok-soft:#e0f3e9; --warn:#b26a00; --warn-soft:#fbefd9;
  --font-body:"Zen Kaku Gothic New",system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
  --font-num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(20,26,36,.06),0 4px 14px rgba(20,26,36,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1118; --surface:#161b25; --surface-2:#1f2633; --line:#2a3242;
  --fg:#e8ecf3; --muted:#97a2b4; --accent:#7f9cff; --accent-soft:#1f2a4a;
  --rec:#ff5a4d; --rec-soft:#3a1b19; --ok:#4fd08f; --ok-soft:#14301f; --warn:#f0b04a; --warn-soft:#352812;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1118; --surface:#161b25; --surface-2:#1f2633; --line:#2a3242;
  --fg:#e8ecf3; --muted:#97a2b4; --accent:#7f9cff; --accent-soft:#1f2a4a;
  --rec:#ff5a4d; --rec-soft:#3a1b19; --ok:#4fd08f; --ok-soft:#14301f; --warn:#f0b04a; --warn-soft:#352812;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.55}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 40px}
header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);margin-inline:-16px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 10px;border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.02em}
.sub{color:var(--muted);font-size:12px}
.cost{font-family:var(--font-num);font-size:15px;font-variant-numeric:tabular-nums;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
.cost b{font-weight:600}
.scroller{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-top:10px;padding-bottom:2px}
.scroller::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip.warn[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:#fff}
.chip:focus-visible,.card:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row2{display:flex;gap:8px;margin-top:8px;align-items:center}
select{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:6px 8px}
.icon-btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:5px 9px;font:inherit;font-size:13px;cursor:pointer}
.note{margin:12px 0 4px;font-size:12px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:8px 10px}
.note.warn{color:var(--warn);background:var(--warn-soft)}
.list{display:grid;gap:12px;margin-top:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:4px 12px;text-align:left;color:inherit;font:inherit;width:100%}
.card.crit{border-color:color-mix(in srgb,var(--rec) 45%,var(--line))}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.pill{font-size:11.5px;border-radius:6px;padding:2px 7px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.type{background:var(--accent-soft);color:var(--accent);font-weight:500}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.rec{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-num);font-weight:700;letter-spacing:.08em;font-size:12px;color:var(--rec);background:var(--rec-soft);border-radius:6px;padding:1px 7px}
.rec::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--rec)}
.score{grid-row:1 / span 2;grid-column:2;text-align:right;line-height:1}
.score .n{font-family:var(--font-num);font-weight:700;font-size:36px;font-variant-numeric:tabular-nums}
.score .l{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.08em;margin-top:2px}
.title{font-weight:700;font-size:16px;margin-top:4px;min-width:0;text-wrap:balance;overflow-wrap:anywhere}
.excerpt{grid-column:1 / -1;margin:6px 0 0;font-size:12.5px;line-height:1.5;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-width:0;overflow-wrap:anywhere}
.facts{grid-column:1 / -1;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13px;margin:8px 0 0}
.facts dt{color:var(--muted)} .facts dd{margin:0;min-width:0;overflow-wrap:anywhere}
.client{grid-column:1 / -1;display:flex;align-items:center;gap:10px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px;min-width:0}
.ava{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;object-fit:cover;background:var(--muted)}
.client .who{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.num{font-family:var(--font-num);font-size:15px;font-variant-numeric:tabular-nums}
.ff{margin-left:auto;text-align:right;white-space:nowrap}
.ff small{display:block;color:var(--muted);font-size:10.5px;font-family:var(--font-body)}
.empty{text-align:center;color:var(--muted);padding:40px 0}
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:20px 20px 0 0;max-height:88%;overflow-y:auto;padding:8px 16px calc(24px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;box-shadow:0 -8px 30px rgba(0,0,0,.18)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.sheet h2{font-size:18px;margin:6px 0 2px;text-wrap:balance;overflow-wrap:anywhere}
.sec{margin-top:18px}
.sec h3{font-size:12px;letter-spacing:.08em;color:var(--muted);margin:0 0 8px;font-weight:500}
.post{background:var(--surface-2);border-radius:12px;padding:12px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.post + .post{margin-top:8px}
.post .from{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px}
.media{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;margin-top:8px}
.media img{width:100%;border-radius:10px;display:block;aspect-ratio:1;object-fit:cover;background:var(--surface-2)}
.people{display:grid;gap:8px}
.person{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.person .who{min-width:0;flex:1}
.person .id{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.breakdown{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13px;margin:0}
.breakdown dd{margin:0;text-align:right;font-family:var(--font-num);font-size:15px;font-variant-numeric:tabular-nums}
.breakdown .total{border-top:1px solid var(--line);padding-top:4px;font-weight:700}
.actions{display:flex;gap:8px;margin-top:20px}
.btn{flex:1;text-align:center;font:inherit;font-weight:700;border-radius:12px;padding:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="bar">
      <div><h1>ファインダー <span class="sub" style="font-family:var(--font-num);font-size:14px;letter-spacing:.12em">FINDER</span></h1><div class="sub" id="count">読み込み中…</div></div>
      <div class="cost" id="cost" title="今月の API 費用 / 目標">今月 —</div>
    </div>
    <div class="scroller" id="presets" role="group" aria-label="絞り込み"></div>
    <div class="row2">
      <div class="scroller" id="types" role="group" aria-label="種類" style="margin-top:0;flex:1;min-width:0"></div>
      <select id="sort" aria-label="並び順">
        <option value="score">点数順</option>
        <option value="new">新着順</option>
        <option value="ff">FF率順</option>
        <option value="followers">フォロワー数順</option>
      </select>
      <button class="icon-btn" id="reload" aria-label="最新にする" title="最新にする">↻</button>
    </div>
  </header>
  <p class="note" id="status" hidden></p>
  <div class="list" id="list"></div>
</div>
<div id="sheetRoot" hidden></div>

<script>
const PRESETS=[{k:"all",t:"すべて"},{k:"crit",t:"クリティカル"},{k:"near",t:"首都圏"},{k:"rejected",t:"対象外(確認用)",cls:"warn"}];
const TYPES=["コスプレ撮影","コスパフォ","踊ってみた","ポートレート","イベント","その他"];
const ROLE={mention:"メンション",quoted:"引用元の投稿者",reply_to:"リプライ先"};
let state={preset:"all",types:new Set(),sort:"score"};
let cases=[],loadedView=null;
try{const s=JSON.parse(localStorage.getItem("finder-ui")||"null");if(s){state.preset=s.preset||"all";state.sort=s.sort||"score";state.types=new Set(s.types||[])}}catch(e){}
const save=()=>{try{localStorage.setItem("finder-ui",JSON.stringify({preset:state.preset,sort:state.sort,types:[...state.types]}))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>n==null?"—":Number(n).toLocaleString("ja-JP");
const ffVal=u=>!u.following?Infinity:(u.followers||0)/u.following;
const ffText=u=>u.followers==null?"—":!u.following?"—":((u.followers||0)/u.following).toFixed(1);
const safeX=u=>/^https:\/\/(x|twitter)\.com\//.test(u||"")?u:null;
const safeImg=u=>/^https:\/\/pbs\.twimg\.com\//.test(u||"")?u:null;
function ago(iso){if(!iso)return"";const m=Math.round((Date.now()-new Date(iso))/6e4);if(m<1)return"たった今";if(m<60)return`${m}分前`;const h=Math.round(m/60);if(h<24)return`${h}時間前`;return`${Math.round(h/24)}日前`}
function ava(u){const img=safeImg(u.profile_image);const ch=esc((u.name||u.username||"?").trim()[0]||"?");
  return img?`<img class="ava" src="${esc(img)}" alt="" loading="lazy" referrerpolicy="no-referrer">`:`<span class="ava">${ch}</span>`}

async function api(path){const r=await fetch(path,{credentials:"same-origin"});if(!r.ok)throw new Error(`${r.status}`);return r.json()}
async function load(){
  const view=state.preset==="rejected"?"rejected":"judged";
  $("count").textContent="読み込み中…";
  try{
    const [list,sum]=await Promise.all([api(`/api/cases?view=${view}`),api("/api/summary")]);
    cases=list.cases;loadedView=view;
    $("cost").innerHTML=`今月 <b>¥${fmt(sum.month_cost_yen)}</b> / ¥${fmt(sum.goal_yen)}`;
    const st=$("status");
    const parts=[];
    if(sum.last_run_at)parts.push(`最終収集 ${ago(sum.last_run_at)}`);
    if(sum.waiting)parts.push(`判定待ち ${sum.waiting}件`);
    if(sum.last_run_status==="failed")parts.push("前回の収集は失敗しました");
    st.textContent=parts.join(" ・ ");st.hidden=!parts.length;st.classList.toggle("warn",sum.last_run_status==="failed");
    render();
  }catch(e){$("count").textContent="";$("list").innerHTML=`<div class="empty">読み込めませんでした(${esc(e.message)})。<br>↻ でもう一度試してください。</div>`}
}
function renderControls(){
  $("presets").innerHTML=PRESETS.map(p=>`<button class="chip ${p.cls||""}" aria-pressed="${state.preset===p.k}" data-p="${p.k}">${p.t}</button>`).join("");
  $("types").innerHTML=TYPES.map(t=>`<button class="chip" aria-pressed="${state.types.has(t)}" data-t="${t}">${t}</button>`).join("");
  $("sort").value=state.sort;
}
function filtered(){
  const a=cases.filter(c=>{
    if(state.preset==="crit"&&!c.critical)return false;
    if(state.preset==="near"&&!c.near)return false;
    if(state.types.size&&!state.types.has(c.case_type))return false;
    return true});
  const by={score:(x,y)=>(y.score??-1e9)-(x.score??-1e9),new:(x,y)=>(y.created_at||"").localeCompare(x.created_at||""),
    ff:(x,y)=>ffVal(y)-ffVal(x),followers:(x,y)=>(y.followers||0)-(x.followers||0)}[state.sort];
  return a.sort(by);
}
function render(){
  renderControls();
  const a=filtered();
  const crit=cases.filter(c=>c.critical).length;
  $("count").textContent=state.preset==="rejected"?`対象外 ${a.length}件(直近2週間)`:`${a.length}件表示中 ・ クリティカル ${crit}件`;
  $("list").innerHTML=a.length?a.map(card).join(""):`<div class="empty">条件に合う案件はありません。<br>絞り込みを外すと全件表示します。</div>`;
}
function place(c){return c.prefecture&&c.prefecture!=="不明"?c.prefecture:"場所不明"}
function card(c){
  const rejected=state.preset==="rejected";
  return `<button class="card ${c.critical?"crit":""}" data-id="${esc(c.id)}">
   <div class="meta">${c.critical?'<span class="rec">REC</span>':""}<span class="pill type">${esc(c.case_type||"その他")}</span><span class="pill">${esc(place(c))}</span>${rejected?`<span class="pill warn">${esc(c.reject_reason||c.skip_reason||"")}</span>`:""}<span class="pill">${ago(c.created_at)}</span></div>
   <div class="score">${rejected?"":`<span class="n">${c.score==null?"—":Math.round(c.score)}</span><span class="l">点</span>`}</div>
   <div class="title">${esc(c.summary||"(要約なし)")}</div>
   <p class="excerpt">${esc((c.text||"").replace(/\s+/g," "))}</p>
   ${c.dates||c.place||c.works?`<dl class="facts">${c.dates?`<dt>日程</dt><dd>${esc(c.dates)}</dd>`:""}${c.place?`<dt>場所</dt><dd>${esc(c.place)}</dd>`:""}${c.works?`<dt>作品</dt><dd>${esc(c.works)}</dd>`:""}</dl>`:""}
   <div class="client">${ava(c)}
    <span class="who">${esc(c.name||"")} <span class="sub">@${esc(c.username||"")}</span>${c.others?` <span class="sub">ほか${c.others}人</span>`:""}</span>
    <span class="ff"><span class="num">${ffText(c)}</span><small>FF率</small></span></div>
  </button>`;
}
function person(p){
  return `<div class="person">${ava(p)}<div class="who"><div>${esc(p.name||p.username||"")} <span class="sub">${ROLE[p.role]||""}</span></div>
    <div class="id">@${esc(p.username||"")}${p.followers!=null?` ・ フォロワー <span class="num">${fmt(p.followers)}</span> ・ FF率 <span class="num">${ffText(p)}</span>`:""}</div></div></div>`;
}
async function openSheet(id){
  $("sheetRoot").innerHTML=`<div class="scrim" data-close="1"></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div><p class="sub">読み込み中…</p></div>`;
  $("sheetRoot").hidden=false;document.body.style.overflow="hidden";
  let c;try{c=await api(`/api/cases/${encodeURIComponent(id)}`)}catch(e){$("sheetRoot").querySelector(".sheet").innerHTML=`<div class="grab"></div><p>読み込めませんでした(${esc(e.message)})。</p><div class="actions"><button class="btn" data-close="1">閉じる</button></div>`;return}
  const xurl=safeX(c.url);const media=(c.media||[]).map(safeImg).filter(Boolean);
  const detail=c.score_detail||[];
  $("sheetRoot").querySelector(".sheet").innerHTML=`<div class="grab"></div>
   <div class="meta">${c.critical?'<span class="rec">REC</span>':""}<span class="pill type">${esc(c.case_type||"その他")}</span>${c.score!=null?`<span class="pill">${Math.round(c.score)}点</span>`:""}<span class="pill">${ago(c.created_at)}に投稿</span>${c.reject_reason?`<span class="pill warn">${esc(c.reject_reason)}</span>`:""}</div>
   <h2>${esc(c.summary||"(要約なし)")}</h2>
   <dl class="facts"><dt>日程</dt><dd>${esc(c.dates||"不明")}</dd><dt>場所</dt><dd>${esc(c.place||"")}${c.place?" ・ ":""}${esc(place(c))}${c.prefecture_source==="プロフィール"?"(プロフィールから推定)":""}</dd>
    ${c.works?`<dt>作品</dt><dd>${esc(c.works)}</dd>`:""}${c.critical_reason?`<dt>REC</dt><dd>${esc(c.critical_reason)}</dd>`:""}</dl>
   <div class="sec"><h3>募集ポスト</h3><div class="post">${esc(c.text)}</div>
    ${c.quoted_text?`<div class="post"><span class="from">引用元のポスト</span>${esc(c.quoted_text)}</div>`:""}
    ${media.length?`<div class="media">${media.map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer"><img src="${esc(u)}" alt="添付画像" loading="lazy" referrerpolicy="no-referrer"></a>`).join("")}</div>`:""}</div>
   ${detail.length?`<div class="sec"><h3>点数の内訳</h3><dl class="breakdown">${detail.map(d=>`<dt>${esc(d.label)}</dt><dd>${d.points>0?"+":""}${Math.round(d.points)}</dd>`).join("")}<dt class="total">合計</dt><dd class="total">${Math.round(c.score)}</dd></dl></div>`:""}
   <div class="sec"><h3>クライアント</h3><div class="people"><div class="person">${ava(c)}<div class="who"><div>${esc(c.name||"")}</div>
    <div class="id">@${esc(c.username||"")} ・ フォロワー <span class="num">${fmt(c.followers)}</span> ・ フォロー <span class="num">${fmt(c.following)}</span> ・ FF率 <span class="num">${ffText(c)}</span></div>
    ${c.location?`<div class="id">地域: ${esc(c.location)}</div>`:""}${c.description?`<div class="id">${esc(c.description)}</div>`:""}</div></div></div></div>
   ${c.people&&c.people.length?`<div class="sec"><h3>関係するアカウント</h3><div class="people">${c.people.map(person).join("")}</div></div>`:""}
   <div class="actions">${xurl?`<a class="btn primary" href="${esc(xurl)}" target="_blank" rel="noopener noreferrer">X で開く</a>`:""}<button class="btn" data-close="1">閉じる</button></div>`;
}
function closeSheet(){$("sheetRoot").hidden=true;$("sheetRoot").innerHTML="";document.body.style.overflow=""}
document.addEventListener("click",ev=>{
  const p=ev.target.closest("[data-p]");if(p){const before=state.preset;state.preset=p.dataset.p;save();
    if((before==="rejected")!==(state.preset==="rejected"))load();else render();return}
  const t=ev.target.closest("[data-t]");if(t){const v=t.dataset.t;state.types.has(v)?state.types.delete(v):state.types.add(v);save();render();return}
  if(ev.target.closest("[data-close]")){closeSheet();return}
  const c=ev.target.closest(".card");if(c)openSheet(c.dataset.id);
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
$("sort").addEventListener("change",e=>{state.sort=e.target.value;save();render()});
$("reload").addEventListener("click",load);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&$("sheetRoot").hidden)load()});
renderControls();load();
</script>
</body>
</html>
