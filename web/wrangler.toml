# N13 ファインダーの Worker。GitHub の Deploy Finder ワークフローが公開する。
# database_id は公開リポジトリに書かず、公開のときに secrets の D1_DATABASE_ID で置き換える。
name = "x-finder"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true
preview_urls = false
# ACCESS_TEAM_DOMAIN と ACCESS_AUD は Cloudflare のダッシュボードで入れる。公開し直しても消さない。
keep_vars = true

[[d1_databases]]
binding = "DB"
database_name = "x_finder"
database_id = "D1_DATABASE_ID_PLACEHOLDER"
