name: Deploy Finder

# N13 X Finder(web/)を Cloudflare Workers に公開する。main の web/ が変わったときと、手動で。
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/deploy-web.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finder-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test
        run: npm test
        working-directory: web
      - name: Fill in the D1 database ID
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: sed -i "s/D1_DATABASE_ID_PLACEHOLDER/${D1_DATABASE_ID}/" wrangler.toml
        working-directory: web
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.145.0 deploy
        working-directory: web
      # N9: Google カレンダーの「iCal 形式の非公開 URL」(リポジトリの secret)を Worker の secret に入れる。登録されていなければ何もしない
      - name: Google カレンダーの URL を Worker に渡す
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GCAL_ICS_URL: ${{ secrets.GCAL_ICS_URL }}
        run: |
          if [ -z "$GCAL_ICS_URL" ]; then echo "GCAL_ICS_URL は未登録なので飛ばします"; exit 0; fi
          printf '%s' "$GCAL_ICS_URL" | npx --yes wrangler@4.145.0 secret put GCAL_ICS_URL
        working-directory: web
