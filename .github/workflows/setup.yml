name: Setup

# 初回だけ使う準備用のワークフロー。上から順に 1 回ずつ実行する。
on:
  workflow_dispatch:
    inputs:
      task:
        description: '実行する準備'
        required: true
        type: choice
        options:
          - 'd1_schema'        # 1. D1 にテーブルを作る
          - 'notion_tables'    # 2. Notion の表を作る
          - 'migrate_preview'  # 3. 今の4表からの振り分け案を見る(書き込まない)
          - 'migrate_apply'    # 4. 振り分け案のとおりに新しい表へ移す
          - 'points_merge_preview'  # 減点語・除外作品・点数表・クリティカル条件を【3】点数表にまとめる案を見る(書き込まない)
          - 'points_merge_apply'    # 案のとおりに【3】点数表を作り、表の番号を振り直す
          - 'old_tables_rename'     # 使わなくなった表の名前を【91】からの番号に付け直す
          - 'tables_sort_preview'   # Notion のページで表を番号の順に並べ直す案を見る(動かさない)
          - 'tables_sort_apply'     # 表を番号の順に並べ直す

concurrency:
  group: finder-setup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}
          NOTION_KEYWORDS_DB_ID: ${{ secrets.NOTION_KEYWORDS_DB_ID }}
          NOTION_EXCLUDES_DB_ID: ${{ secrets.NOTION_EXCLUDES_DB_ID }}
          NOTION_GENRES_DB_ID: ${{ secrets.NOTION_GENRES_DB_ID }}
          NOTION_CONFIG_DB_ID: ${{ secrets.NOTION_CONFIG_DB_ID }}
          TASK: ${{ github.event.inputs.task }}
        run: |
          case "$TASK" in
            d1_schema)       python -u scripts/setup_d1.py ;;
            notion_tables)   python -u scripts/setup_notion.py ;;
            migrate_preview) MODE=preview python -u scripts/migrate_from_old.py ;;
            migrate_apply)   MODE=apply python -u scripts/migrate_from_old.py ;;
            points_merge_preview) MODE=preview python -u scripts/merge_points.py ;;
            points_merge_apply)   MODE=apply python -u scripts/merge_points.py ;;
            old_tables_rename)    python -u scripts/rename_old_tables.py ;;
            tables_sort_preview)  MODE=preview python -u scripts/sort_tables.py ;;
            tables_sort_apply)    MODE=apply python -u scripts/sort_tables.py ;;
          esac
