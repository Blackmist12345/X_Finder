name: Collect

# N0〜N3・N12・N15: X のポストを集めて D1 とユーザー台帳に保存する。
# 定刻起動(Cloudflare のトリガー)は、手動で数回試したあとに追加する。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'production=保存して検索時間枠を進める / dry_run=何も保存しない試し'
        required: true
        type: choice
        default: 'dry_run'
        options:
          - 'dry_run'
          - 'production'
      hours:
        description: '試し実行と初回の実行で、何時間さかのぼるか'
        required: false
        type: choice
        default: '1'
        options:
          - '0.25'
          - '0.5'
          - '1'
          - '2'
          - '4'

concurrency:
  group: finder-collect
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Collect
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          TWITTERAPI_KEY: ${{ secrets.TWITTERAPI_KEY }}
          MODE: ${{ github.event.inputs.mode || 'production' }}
          HOURS: ${{ github.event.inputs.hours || '1' }}
        run: python -u -m finder.run_collect
